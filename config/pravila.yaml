# Rules from experience (BUILD_PROMPT §5, PROCES §6.3).
# Lifecycle: ПАРАМЕТАР-КАНДИДАТ (1–9 cases / untested) → СЛЕДИ (10–29) → ПОТВРДЕН (30+ and clearly better,
#            or better out-of-sample in a backtest) → ОТФРЛЕН (no improvement / stopped working).
# The full list of §5 rules (with n / hit with / hit without) is filled in Phase 7 from the archive —
# statuses there must be computed, never guessed.

pravila:
  EL_STEGNUVANJE_50:
    tip: stegnuvanje_kon_50
    liga: euroleague
    opis: "Привремено: Евролига p_model се стега кон 50%: p' = 0.5 + k·(p − 0.5), додека калибрацијата (isotonic, ≥50 по пазар) не е готова."
    k: 0.5
    status: СЛЕДИ
    datum: 2026-10-29
    izvor: "Одлука на Томе 29.10. Архива ЕЛ: 31/74 = 41.9% наспроти очекувани 61.4%, Brier 0.277 (полошо од 50/50). Brier-оптимален k на архивата = −0.23 (рачниот p за ЕЛ засега не носи информација); k=0.5 → Brier 0.259, k=0 → 0.250. Избран 0.5 (не 0): мал примерок (74) и новиот Python модел не е рачниот."
    n: 74
    preispitaj: "кога ЕЛ ќе има ≥50 нови избори од Python моделот или кога ќе има isotonic калибрација"

  # --- Параметри-кандидати тестирани со walk-forward backtest на минатата сезона (29.10.2026) ---
  MINUTI_70_ISTA_POZICIJA:
    tip: parametar_kandidat
    opis: "При ново отсуство 70% од минутите на иста позиција + usage пренасочување (M3, BUILD_PROMPT §3.2)."
    status: ОТФРЛЕН
    datum: 2026-10-29
    izvor: "Соиграчи при ново отсуство, MAE минути M3 / M2: NBA 6.35 / 5.42, ЕЛ 5.17 / 4.64, ЕК 5.17 / 4.55; пристрасност M3 +1.3…+1.9 мин. Важи M2 (тимот = 240/200 мин)."
  USAGE_POTTIK:
    tip: parametar_kandidat
    opis: "Дополнителна продукција за соиграчите над она што доаѓа од повеќе минути."
    status: ОТФРЛЕН
    datum: 2026-10-29
    izvor: "Штимање (првите 60%) го исклучи во сите 3 лиги."
  PRV_STRELEC_BEZ_YVEZDA:
    tip: parametar_kandidat
    opis: "Ново отсуство на играч со USG ≥ 25% → прв преостанат стрелец + c × поените на ѕвездата."
    status: ОТФРЛЕН
    datum: 2026-10-29
    izvor: "NBA тест n=197: c = −0.02, MAE 6.58 vs M2 6.57; M2 веќе непристрасен (+0.33), наивното −1.69 (потценува). ЕЛ/ЕК премалку случаи. Правило 4 (никогаш ПОД) останува."
  SOIGRAC_SE_VRAKJA:
    tip: parametar_kandidat
    opis: "Соиграч се враќа → покривачите назад кон минутите пред отсуството (α)."
    status: ОТФРЛЕН
    datum: 2026-10-29
    izvor: "α = 0 (NBA n=309, ЕЛ n=29), ЕК α=0.07 полошо; M2 веќе ги намалува минутите. Наспроти „вжештена“ линија ПОД 62% NBA / 76% ЕЛ / 50% ЕК — сценарио за извештај, не параметар."
  ODMOR_B2B:
    tip: parametar_kandidat
    opis: "Тимски поени: B2B и B2B гостин-гостин (сопствен и на противникот)."
    status: ОТФРЛЕН
    datum: 2026-10-29
    izvor: "NBA 2024-25 MAE тотал 14.62→14.64, 2025-26 14.43→14.49 (полошо)."
  NEDELNA_KOREKCIJA_PRISTRASNOST:
    tip: parametar_kandidat
    opis: "Тимски модел: средна грешка на тековната сезона до почетокот на неделата се додава на проекцијата; и/или лигин просек со 15 наместо 60 псевдо-натпревари."
    status: ОТФРЛЕН
    datum: 2026-10-29
    izvor: "Полошо на делот за штимање во сите 3 лиги (NBA А 14.74→15.28, ЕЛ 11.97→12.70); NBA Б малку подобро (14.93→14.78). Пристрасноста се следи неделно во `stats --nedela`."
  PRENOS_MEGJU_SEZONI:
    tip: parametar_kandidat
    opis: "Минатата сезона како prior (carry, P) + неделен лигин просек."
    status: ПОТВРДЕН
    datum: 2026-10-29
    izvor: "NBA тотал MAE 15.81→14.93 (2026-27), ЕЛ 14.40→13.81 (слаб доказ, разлика полоша); ЕК без промена."
  TEAM_NORMALIZACIJA_MINUTI_M2:
    tip: parametar_kandidat
    opis: "Минути = форма, тимот скалиран на 240/200 мин."
    status: ПОТВРДЕН
    datum: 2026-10-29
    izvor: "MAE минути наивно→M2: NBA 5.22→4.92, ЕЛ 4.66→4.43, ЕК 4.44→4.23."
  DISPERZIJA_PO_LAMBDA:
    tip: parametar_kandidat
    opis: "Negative binomial со посебен r по опсег на проекцијата (<1, 1–2, 2–3.5, 3.5–6, ≥6) наместо еден r по пазар."
    status: ПОТВРДЕН
    datum: 2026-10-29
    izvor: "backtest --niski (вон примерок, минатата сезона): log loss подобар ≥ 0.001 за скокови (NBA/ЕЛ/ЕК) и асистенции (ЕЛ/ЕК); NBA скокови 3.5 ПОД≥80%: +3.4 → 0.0 pp. Тројки и NBA асистенции: без промена."
  ZERO_INFLATION:
    tip: parametar_kandidat
    opis: "Вишок нули (zero-inflated NB) за тројки/скокови/асистенции."
    status: ОТФРЛЕН
    datum: 2026-10-29
    izvor: "backtest --niski: штимањето бира π≈0 (тројки), log loss не подобар во ниту една лига."
  PRENOS_IGRAC:
    tip: parametar_kandidat
    opis: "Приор за стапките на играчот од минатата сезона на почеток на сезона (како PRENOS_MEGJU_SEZONI кај тимовите)."
    status: ПАРАМЕТАР-КАНДИДАТ
    datum: 2026-10-29
    izvor: "Наод 29.10: многу EV > 15% кај играчи со 3–4 натпревари (пр. Camara тројки μ 4.2). Чека backtest на првите 15 натпревари + одобрение."

  # --- Филтри по одлука на Томе (30.10.2026), пред уплата ---
  NBA_GLAVNI_PAZARI_HARTIJA:
    tip: filter
    opis: "NBA хендикеп / тотал / тимски тотал / 1x2 → ЗНАК: САМО_ХАРТИЈА (се запишува, не оди во тикет)."
    status: ПОТВРДЕН
    datum: 2026-10-30
    izvor: "Backtest Фаза 4: модел ≈ пазар на тотал (MAE 14.43 vs 14.35), полош на хендикеп (11.97 vs 10.92); модел против линија 47–49% → нема предност."
  NISKI_LINII_NE_VO_TIKET:
    tip: filter
    opis: "Тројки ≤ 1.5, скокови/асистенции ≤ 2.5 → ПРОВЕРИ_ПОДАТОЦИ (не во тикет)."
    status: СЛЕДИ
    datum: 2026-10-30
    izvor: "Одлука на Томе (претпазливост). Забелешка Claude: `backtest --niski` (29.10) ги тестираше овие прагови — по поправката на дисперзијата грешката е 0–1.3 pp (NBA скокови 2.5: +1.3 pp; тројки 0.5: моделот ги потценува нулите). Да се преиспита кога хартијата ќе има ≥ 30 вакви избори."
  NBA_POENI_NAD_EV8:
    tip: filter
    opis: "NBA поени НАД само со EV ≥ 8% (и ≤ 15%, општо правило)."
    status: СЛЕДИ
    datum: 2026-10-30
    izvor: "Одлука на Томе 30.10 (хартија 29.10: NBA поени мал примерок). Без backtest — да се преиспита по 30 избори."

  # --- Лекции од 30.10 (Томе 31.10) — 1 случај: предупредување, не ново правило за моделот ---
  MAKS_2_TIKETI_PO_IGRAC:
    tip: upravuvanje_rizik
    opis: "Еден играч најмногу на 2 предложени тикети (не е модел — ризик: еден лош натпревар не смее да ги сруши сите тикети)."
    status: ПОТВРДЕН
    datum: 2026-10-31
    izvor: "„Ефект White“ 30.10: White (BOS) асистенции НАД 4.5 беше на сите тикети → 4 → сите паднаа заедно. `model/picks.py propose_tickets`."
  IGRACKI_PAZARI_HARTIJA:
    tip: filter
    opis: "Сите играчки пазари (NBA + ЕЛ + ЕК) → ЗНАК: САМО_ХАРТИЈА (се запишуваат, не одат во тикет). `model/picks.py PLAYER_PROPS_PAPER`."
    status: ПОТВРДЕН
    datum: 2026-10-31
    izvor: "Одлука на Томе 31.10. Архива 16–30.10 (743 оценети кандидати, избрани + одбиени): модел очекува 65.1%, пазар (de-vig) 49.6%, погодено 50.5%; log loss модел 0.754 > 50/50 0.693 > пазар 0.691. Се укинува само по backtest што покажува предност наспроти пазарот."
  MINUTI_V2_ZA_ROTACIJA:
    tip: parametar_kandidat
    opis: "Минути за играчи со EWMA ≥ 24 (NBA; ЕЛ/ЕК ≥ 20): сопствена EWMA без присилно делење на 240/200 (V2), наместо V0."
    status: ПАРАМЕТАР-КАНДИДАТ
    datum: 2026-10-31
    izvor: "Backtest 31.10 (scratchpad minutes_bt.py): V2 подобар MAE кај ѕвезди/стартери во сите 3 лиги (NBA ѕвезди 4.04→3.87, ЕЛ 4.40→4.06), полош кај клупата; живите пропсови −2.0 мин (V2 −0.2). Калибрацијата измешана (архива 65.9→64.4, NBA синтетички ПОД полошо) → не е јасен победник; чека повеќе податоци + одобрение."
  BLOWOUT_MINUTI_STARTERI:
    tip: parametar_kandidat
    opis: "Стартери на фаворит со spread ≥ 8: проекцијата на минути (па поени/скокови/асистенции) да се намали според историската загуба на минути при голема разлика. Денес blowout е САМО ознака (scenarios.py, праг 12) — не ги менува минутите ни веројатностите."
    status: ПАРАМЕТАР-КАНДИДАТ
    datum: 2026-10-31
    izvor: "30.10 BOS водеше +32, White 25.5 мин → асистенциите застанаа на 4. Еден случај → чека backtest (минати сезони: минути на стартерите кај фаворит ≥ 8 наспроти просек) + одобрение. До тогаш само ⚠️ во извештајот."
