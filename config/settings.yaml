# Betting Prediction — central settings (BUILD_PROMPT §9).
# Values marked "calibrate" are starting points and must be re-estimated from data (PROCES §6.4).

timezone: Europe/Skopje

paths:
  raw: data/raw              # every download is cached here (data/raw/<league>/<date>/*.json)
  processed: data/processed  # derived tables (game logs sorted by date) — rebuilt from raw
  reports: reports

http:
  timeout_s: 30
  retries: 3
  backoff_s: 2.0      # wait before retry n = backoff_s * n
  pause_s: 0.4        # pause between consecutive requests (be polite to free sources)
  rate_limit_max_wait_s: 600  # on HTTP 429 wait what the server asks (Retry-After), at most this.
                              # live.euroleague.net allowed ~64 box scores, then asked for ~270 s (29.10.2026)
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

euroleague_api:
  feeds_base: https://feeds.incrowdsports.com/provider/euroleague-feeds
  live_base: https://live.euroleague.net/api
  schedule_limit: 500   # one page holds the whole season (EL 380, EC 224 games in 2026-27)
  stats_limit: 400      # players per stats request (EL had 233 on 29.10.2026)

mozzart:
  # Odds are ONLY cached (data/raw/mozzart/<date>/<HHMMSS>.json) — no model reads them before
  # Phase 7 (anti-anchoring). Every run is a new snapshot; nothing is overwritten.
  base: https://www.mozzartbet.mk
  sport_id: 2                 # basketball
  page_size: 50
  odds_batch: 30              # matchIds per getBettingOdds call (API limit)
  offer_name: "Комплетна понуда"

evrotip:
  # Second bookmaker, CACHE ONLY (decision 29.10). <label>: [sport, leagueId]; null = not found yet.
  base: https://www.evrotip.mk
  leagues:
    nba: [B, 124835]
    nba_igraci: [SK, 116680]
    euroleague: [B, 100835]
    euroleague_igraci: [SK, 151108]
    eurocup: [B, 100834]
    eurocup_igraci: null          # not listed on 29.10 (no EuroCup games) — find when offered

llm_istrazuvaci:              # docs/LLM_ISTRAZUVACI.md - FREE models only FIND and CHECK, never analyse
  enabled: true               # FreeLLMAPI on 127.0.0.1:31415 (.env); test 30.10 → `python main.py llm rezime`
  timeout_s: 90
  # Only models that PASSED the test set (tests/llm, official answers): T1 ≥ 95%, invented quotes < 5%,
  # answered ≥ 90%. Test 30.10: T1 qwen3.8-27b 95.8% / 0.0%; T9 gpt-oss-120b 90.1% / 4.4%.
  # gpt-oss-120b T1 93.0% (the 3 misses = QUESTIONABLE/DOUBTFUL instead of OUT, same as qwen's — careful side);
  # Gemini: 100% on what it answered but the free daily quota ran out after 15–20 calls (re-test when it resets).
  models:
    T1: [qwen3.8-27b]
    T9: [gpt-oss-120b]
    T10: [qwen3.8-27b, gpt-oss-120b]   # T10: qwen 93.9% / 0.0% (31.10) ✅; gpt-oss-120b 90.9% / 0.6%, 50/50 answered (1.11) ✅ → two families pass
  # Re-test 1.11 (new FreeLLMAPI models): Gemini 3.6-flash / 3.5-flash / 3-flash-preview / 3.5-flash-lite = 91–100% correct,
  # 0% invented, but only 3–17 of 50 answered (Google free quota) → ❌; nemotron / dots3 / poolside = provider auth error.
  # second model for the two-model check where only one passes. Tome 31.10: ALLOWED below the threshold, status
  # СЛЕДИ — an item counts only if BOTH models agree AND the quote is in the text; agreement rate is logged per run
  # (archive/llm_log.db → llm_soglasuvanje, `python main.py llm rezime`). If Gemini passes the re-test → it replaces these.
  kontrolor:
    T1: gpt-oss-120b
    T9: qwen3.8-27b
  kontrolor_status: СЛЕДИ      # T1 and T9 only; T10 has two models that passed (1.11)

nba_api:
  pause_s: 0.8          # stats.nba.com throttles/blocks aggressive clients
  retry_wait_s: 10      # wait before retry n = retry_wait_s * n
  season_type: Regular Season
  # gameId prefixes kept: 002 regular season (incl. NBA Cup group games), 004 playoffs,
  # 005 play-in, 006 NBA Cup final. Preseason (001) excluded — minutes are artificial (PROCES §7).
  game_types: ["002", "004", "005", "006"]

leagues:
  euroleague:
    name_mk: Евролига
    source: euroleague
    competition_code: E
    season: E2026
    prev_season: E2025            # backtest (Phase 4)
    prev2_season: E2024           # season-start test (prior for E2025)
    player_model:                 # Phase 5 backtest 29.10.2026 (same choice tuned independently in all 3 leagues)
      half_life: 8                # games
      rate_prior_minutes: 75      # pseudo-minutes of position-average per-minute production
      minutes_model: m2           # team scaled to regulation minutes; the 70%-same-position formula (m3) was worse
      usage_boost: false          # extra usage for the absent player's production did not help
      dvp_weight: 0.5             # half the DvP deviation, capped ±15% NBA / ±12% EL/EC (tiny gain)
      dispersion: {pts: 4.3, fgm3: 7.9, reb: {r_po_mu: [1, 2, 12, 8, 6]}, ast: {r_po_mu: [1.5, 2, 12, 20, 1000000]}}   # NB size r, fitted on last season's first 60%; reb/ast: r per projected-mean range <1,1–2,2–3.5,3.5–6,≥6 (backtest --niski 29.10)
    team_model:                   # chosen by walk-forward backtest 29.10.2026 (reports/backtest_tim_euroleague_*.md)
      variant: V3                 # pace × efficiency + opponent adjustment; form/Four Factors/rest did not help
      shrink_games: 6
      half_life: null
      opp_adjust: true
      use_ff: false
      use_rest: false             # no back-to-backs in the EuroLeague
      season_mode: carryover      # season-start test 29.10: E2026 total MAE 14.40 → 13.81, margin 8.80 → 9.18 (trade-off)
      carry: 0.7                  # weak evidence: on the tuning start (E2025, n=60) all carryover variants within 0.15
      prior_games: 20
      lg_prior_games: 60
    home_advantage_pts: 3.0       # calibrate
    min_expected_minutes: 20      # rule 13
    mozzart_competition_id: 26
    mozzart_players_competition_id: 8578
  eurocup:
    name_mk: Еврокуп
    source: euroleague
    competition_code: U
    season: U2026
    prev_season: U2025
    prev2_season: U2024
    player_model:                 # Phase 5 backtest 29.10.2026 (same choice tuned independently in all 3 leagues)
      half_life: 8                # games
      rate_prior_minutes: 75      # pseudo-minutes of position-average per-minute production
      minutes_model: m2           # team scaled to regulation minutes; the 70%-same-position formula (m3) was worse
      usage_boost: false          # extra usage for the absent player's production did not help
      dvp_weight: 0.5             # half the DvP deviation, capped ±15% NBA / ±12% EL/EC (tiny gain)
      dispersion: {pts: 4.8, fgm3: 8.5, reb: {r_po_mu: [1, 3, 40, 6, 6]}, ast: {r_po_mu: [2, 1.5, 20, 12, 10.4]}}   # NB size r, fitted on last season's first 60%; reb/ast: r per projected-mean range <1,1–2,2–3.5,3.5–6,≥6 (backtest --niski 29.10)
    team_model:                   # backtest 29.10.2026 — only 61 out-of-sample games → weak evidence
      variant: V4                 # + form (half-life 10 games)
      shrink_games: 3
      half_life: 10
      opp_adjust: true
      use_ff: false
      use_rest: false
      season_mode: pooled         # season-start test 29.10 (U2025 n=40, U2026 n=80): carryover not better → unchanged
    home_advantage_pts: 4.0       # calibrate
    min_expected_minutes: 20      # rule 13
    mozzart_competition_id: 1147
    mozzart_players_competition_id: 11924
  nba:
    name_mk: NBA
    source: nba                   # Phase 2
    season: "2026-27"
    prev_season: "2025-26"
    prev2_season: "2024-25"
    player_model:                 # Phase 5 backtest 29.10.2026 (same choice tuned independently in all 3 leagues)
      half_life: 8                # games
      rate_prior_minutes: 75      # pseudo-minutes of position-average per-minute production
      minutes_model: m2           # team scaled to regulation minutes; the 70%-same-position formula (m3) was worse
      usage_boost: false          # extra usage for the absent player's production did not help
      dvp_weight: 0.5             # half the DvP deviation, capped ±15% NBA / ±12% EL/EC (tiny gain)
      dispersion: {pts: 7.2, ast: 13.1, fgm3: 8.9, reb: {r_po_mu: [1, 1, 12, 12, 20]}}   # NB size r, fitted on last season's first 60%; reb/ast: r per projected-mean range <1,1–2,2–3.5,3.5–6,≥6 (backtest --niski 29.10)
    team_model:                   # backtest 29.10.2026 (507 out-of-sample games + closing lines)
      variant: V4                 # + form (half-life 10 games); Four Factors/rest did not help
      shrink_games: 6
      half_life: 10
      opp_adjust: true
      use_ff: false
      use_rest: false             # back-to-back categories tested 29.10 on 2024-25 + 2025-26: no gain
      season_mode: carryover      # season-start test 29.10: total MAE 15.81 → 14.93 on 2026-27 (bias +4.7 → +3.4)
      carry: 0.7
      prior_games: 5
      lg_prior_games: 60          # league average updated weekly from the current season
    home_advantage_pts: 2.0       # calibrate
    min_expected_minutes: 24      # rule 13
    mozzart_competition_id: 23
    mozzart_players_competition_id: 11940

thresholds:
  min_ev: 0.04                    # PROCES §1: EV >= +4% after calibration
  min_p: 0.58
  market_alarm_pp: 15             # |p_model - p_market| > 15 pp -> ПРОВЕРИ_ПОДАТОЦИ
  euroleague_fixed_correction_pp: -8
  calibration_min_n: 50           # isotonic only with >= 50 picks per league+market
  new_absence_lookback_games: 3   # played in last 3 -> НОВО отсуство
  minutes_uncertainty_max: 4      # ±4 min uncertain -> no position

stake:
  kelly_fraction: 0.25
  max_pick_pct: 2.0
  max_ticket_pct: 3.0

limits:
  ticket_min_picks: 2
  ticket_max_picks: 3
  eurocup_max_picks_per_night: 2  # rule 14
  eurocup_rule_until_n: 30
